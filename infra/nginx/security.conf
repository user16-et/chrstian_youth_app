limit_req_zone $binary_remote_addr zone=api_general:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;

server {
  listen 80;
  server_name api.example.org;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.example.org;

  ssl_certificate /run/secrets/tls_certificate;
  ssl_certificate_key /run/secrets/tls_private_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;

  client_max_body_size 1m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  location ~ ^/(auth/login|auth/register|journey/otp/request) {
    limit_req zone=api_auth burst=5 nodelay;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://api:3000;
  }

  location / {
    limit_req zone=api_general burst=40 nodelay;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://api:3000;
  }
}
