name: christian_youth_super_app
description: Ethiopia-focused Christian youth super app starter
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_webrtc: ^0.12.5
  http: ^1.6.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  socket_io_client: ^3.1.6
  sqflite: ^2.4.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  share_plus: ^13.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf
