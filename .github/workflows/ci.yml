name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Point the test harness at the CI Postgres service (default host port 5432).
      TEST_PGHOST: localhost
      TEST_PGPORT: '5432'
      TEST_PGUSER: postgres
      TEST_PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # api tests import from the shared workspace — build it first.
      - run: npm run build:shared
      - run: npm run lint:api
      - run: npm run lint:worker
      - run: npm run build:api
      - run: npm run build:worker
      - run: npm run test:api
      - run: npm run test:worker
